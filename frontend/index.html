<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s-Pathfinder | Kubernetes Attack Path Visualizer</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    h1 {
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      font-size: 0.75rem;
      background-color: #ef4444;
      color: white;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .controls {
      display: flex;
      gap: 1rem;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }
    #network {
      flex: 3;
      height: 100%;
      background: radial-gradient(circle, #1e293b 10%, #0f172a 90%);
    }
    .sidebar {
      flex: 1;
      background-color: #1e293b;
      border-left: 1px solid #334155;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: #94a3b8;
    }
    .path-item {
      background: #1e293b;
      border-left: 4px solid #ef4444;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .path-item:hover {
      background: #334155;
      transform: translateX(4px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .path-item.active {
      border-left-color: #38bdf8;
      background: #334155;
    }
    .path-step {
      color: #38bdf8;
      font-family: monospace;
      margin: 0.3rem 0;
      padding: 0.2rem 0.4rem;
      border-radius: 0.2rem;
      transition: background 0.15s;
    }
    .path-step:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ K8s-Pathfinder <span class="badge">Live Cluster</span></h1>
    <div class="controls">
      <button onclick="fetchScan()">🔄 Rescan Cluster</button>
    </div>
  </header>
  <div class="container">
    <div id="network"></div>
    <div class="sidebar">
      <div class="card">
        <h3>Cluster Summary</h3>
        <p id="summary-nodes">Nodes: Loading...</p>
        <p id="summary-edges">Edges: Loading...</p>
        <p id="summary-risks" style="color: #ef4444; font-weight: bold; margin-top: 0.5rem;">Detected Attack Vectors: Loading...</p>
      </div>
      <div class="card">
        <h3>🚨 Critical Attack Paths</h3>
        <p style="font-size: 0.75rem; color: #64748b; margin-bottom: 0.5rem;">Click any path or step to focus and zoom in the graph.</p>
        <div id="attack-paths-list">Scanning...</div>
      </div>
    </div>
  </div>

  <script>
    let network = null;
    let currentData = null;

    async function fetchScan() {
      try {
        const res = await fetch('/api/scan');
        const data = await res.json();
        currentData = data;
        
        document.getElementById('summary-nodes').innerText = `Total Entities: ${data.nodes.length}`;
        document.getElementById('summary-edges').innerText = `Privilege Links: ${data.edges.length}`;
        document.getElementById('summary-risks').innerText = `Attack Paths to Master: ${data.attack_paths.length}`;

        renderAttackPaths(data.attack_paths);
        renderGraph(data.nodes, data.edges, data.attack_paths);
      } catch (err) {
        console.error(err);
        alert('Failed to connect to scanner API');
      }
    }

    function focusNode(nodeId, event) {
      if (event) event.stopPropagation();
      if (!network) return;

      network.selectNodes([nodeId]);
      network.focus(nodeId, {
        scale: 1.4,
        animation: {
          duration: 800,
          easingFunction: 'easeInOutQuad'
        }
      });
    }

    function focusPath(nodesInPath, cardElement) {
      if (!network) return;

      // Update active state in UI
      document.querySelectorAll('.path-item').forEach(el => el.classList.remove('active'));
      if (cardElement) cardElement.classList.add('active');

      // Select all nodes and fit them into viewport smoothly
      network.selectNodes(nodesInPath);
      network.fit({
        nodes: nodesInPath,
        animation: {
          duration: 800,
          easingFunction: 'easeInOutQuad'
        }
      });
    }

    function renderAttackPaths(paths) {
      const container = document.getElementById('attack-paths-list');
      if (!paths || paths.length === 0) {
        container.innerHTML = '<p style="color: #22c55e;">No direct escalation paths found.</p>';
        return;
      }

      container.innerHTML = paths.map((p, i) => {
        const pathJson = JSON.stringify(p.path).replace(/"/g, '&quot;');
        return `
          <div class="path-item" onclick="focusPath(${pathJson}, this)">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>Path #${i + 1} (${p.hops} hops)</strong>
              <span style="font-size:0.7rem; color:#94a3b8;">🔍 Focus Path</span>
            </div>
            ${p.path.map(step => `
              <div class="path-step" onclick="focusNode('${step}', event)">↳ ${step}</div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function renderGraph(nodesRaw, edgesRaw, paths) {
      const pathNodes = new Set();
      paths.forEach(p => p.path.forEach(n => pathNodes.add(n)));

      const nodes = nodesRaw.map(n => {
        const isPath = pathNodes.has(n.id);
        const isMaster = n.id === 'MasterNode';
        
        let color = '#3b82f6';
        let shape = 'dot';
        
        if (isMaster) {
          color = '#dc2626';
          shape = 'star';
        } else if (isPath) {
          color = '#f97316';
        } else if (n.data.type === 'ServiceAccount') {
          color = '#8b5cf6';
          shape = 'diamond';
        }

        return {
          id: n.id,
          label: n.id.split('/').pop() || n.id,
          title: JSON.stringify(n.data, null, 2),
          color: {
            background: color,
            border: isPath ? '#ef4444' : '#1e293b',
            highlight: { background: '#ef4444', border: '#ffffff' }
          },
          shape: shape,
          size: isMaster ? 25 : (isPath ? 18 : 12),
          font: { color: '#f8fafc', size: 12 }
        };
      });

      const edges = edgesRaw.map(e => {
        return {
          from: e.source,
          to: e.target,
          arrows: 'to',
          label: e.relation || '',
          color: { color: '#64748b', highlight: '#ef4444' },
          font: { color: '#94a3b8', size: 9, align: 'middle' }
        };
      });

      const container = document.getElementById('network');
      const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
      const options = {
        physics: {
          stabilization: false,
          barnesHut: { springLength: 120, gravitationalConstant: -3000 }
        }
      };

      if (network) network.destroy();
      network = new vis.Network(container, data, options);
    }

    window.onload = fetchScan;
  </script>
</body>
</html>
